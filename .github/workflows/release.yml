name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install release tooling
        run: python -m pip install -e ".[dev]"
      - name: Full validation
        run: verse-ai validate
      - name: Python quality
        run: |
          ruff check src tools tests
          ruff format --check src tools tests
          mypy src/verse_ai_knowledge
          pytest
      - name: Build package
        run: python -m build
      - name: Clean-install wheel smoke test
        run: |
          python -m venv /tmp/verse-ai-release-test
          /tmp/verse-ai-release-test/bin/python -m pip install dist/*.whl
          /tmp/verse-ai-release-test/bin/verse-ai version
      - name: Build release evidence
        run: |
          python tools/api_coverage_snapshot.py
          python tools/generate_release_audit.py --github-ci PASS
          python - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('.')
          out=root/'dist'/'verse-ai-portable-current'
          if out.exists(): shutil.rmtree(out)
          shutil.copytree(root/'portable'/'current',out)
          shutil.make_archive(str(root/'dist'/'verse-ai-portable-current'),'zip',out)
          shutil.rmtree(out)
          PY
          sha256sum dist/* > dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/* reports/PUBLIC_RELEASE_AUDIT_CURRENT.md reports/api-coverage/* --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
