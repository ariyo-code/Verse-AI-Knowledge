name: Docs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "README.md", "ROADMAP.md", "CHANGELOG.md"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[docs]"
      - run: mkdocs build --strict
