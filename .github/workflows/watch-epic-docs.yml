name: Watch Epic Verse / UEFN docs

on:
  workflow_dispatch:
  schedule:
    - cron: "31 6 * * *"

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Index official source dependencies
        run: python tools/index_source_dependencies.py

      - name: Fetch official Epic fingerprints
        run: python tools/watch_epic_sources.py

      - name: Compare with accepted baseline
        run: python tools/compare_epic_snapshot.py

      - name: Build revalidation queue
        run: python tools/build_revalidation_queue.py

      - name: Print report
        run: python tools/revalidation_report.py

      - name: Upload maintenance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: epic-doc-watch
          path: |
            maintenance/live_snapshot.json
            maintenance/change_report.json
            maintenance/revalidation_queue.json
            maintenance/source_dependencies.json

      - name: Open issue when revalidation is required
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path("maintenance/revalidation_queue.json").read_text())
          items=q.get("items",[])
          if not items:
              Path("/tmp/needs_issue").write_text("no")
              raise SystemExit(0)

          lines=[
              "## Epic documentation change detected",
              "",
              f"Baseline Verse API: `{q.get('baseline_version')}`",
              f"Detected Verse API: `{q.get('detected_version')}`",
              "",
              "The watcher **does not auto-promote or auto-rewrite verified knowledge**.",
              "These items need review:",
              ""
          ]
          for i,x in enumerate(items,1):
              lines.append(f"{i}. **[{x.get('priority')}]** {x.get('reason')}")
              if x.get("source_url"):
                  lines.append(f"   - Source: {x['source_url']}")
              if x.get("impacted_files"):
                  lines.append(f"   - Impact hints: {', '.join(x['impacted_files'][:8])}")
          Path("/tmp/issue_body.md").write_text("\n".join(lines))
          Path("/tmp/needs_issue").write_text("yes")
          PY

          if [ "$(cat /tmp/needs_issue)" != "yes" ]; then
            exit 0
          fi

          existing="$(gh issue list --state open --search 'Verse knowledge revalidation required in:title' --json number --jq '.[0].number // empty')"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/issue_body.md
          else
            gh issue create               --title "Verse knowledge revalidation required"               --body-file /tmp/issue_body.md               --label "documentation" ||             gh issue create               --title "Verse knowledge revalidation required"               --body-file /tmp/issue_body.md
          fi
