name: V25 CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  lint-types-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]"
      # V25 standardizes the installable package first. Legacy tools/tests are
      # migrated incrementally instead of turning existing technical debt into
      # a false release blocker.
      - run: ruff check src/verse_ai_knowledge
      - run: mypy src/verse_ai_knowledge
      - run: python -m build
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/validate_v25_integrity.py
      - run: python tools/validate_integrity.py
      - run: python tools/check_verification.py
      - run: python tools/api_revalidation_gate.py --strict
  prompts-generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/build_prompts.py
      - name: Check generated prompt drift (including untracked files)
        shell: bash
        run: |
          status="$(git status --porcelain -- PROMPT_AI_CHAT_FR_EN.md portable/current)"
          if [ -n "$status" ]; then
            echo "Generated prompt drift detected:"
            printf '%s\n' "$status"
            exit 1
          fi
      - run: python tests/prompts/test_prompt_consistency.py || python -m pytest -q tests/prompts
  schemas-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[dev]"
      - run: pytest --cov=src/verse_ai_knowledge --cov-report=term --cov-report=xml tests
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tests/test_epic_url_security.py
      - run: python tools/check_internal_paths.py
      - run: python tools/scan_secrets.py
  retrieval-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tools/rag_benchmark.py
      - run: python tools/rag_metrics_v25.py
      - run: python tools/run_evidence_benchmark.py
      - run: python tools/run_hallucination_evals.py
      - run: python evals/llm/runner.py
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e .
      - run: verse-ai doctor
      - run: verse-ai validate
      - run: |
          echo "UEFN compile: NOT TESTED"
          echo "Runtime: NOT TESTED"
          echo "Multiplayer: NOT TESTED"
          echo "LLM benchmark: SKIPPED unless explicitly configured"
