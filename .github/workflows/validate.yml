name: Validate Knowledge Base

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Static repository validation
        run: |
          python tools/validate_all.py

      - name: Static self test
        run: |
          python tools/self_test.py
