name: Validate knowledge base

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository
        run: python tools/validate_repo.py

      - name: Validate verification evidence
        run: python tools/check_verification.py

      - name: Build error index
        run: python tools/build_error_index.py

      - name: Show catalog report
        run: python tools/catalog_report.py

      - name: Show knowledge freshness
        run: python tools/staleness_report.py
