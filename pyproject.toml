[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verse-ai-knowledge"
version = "24.0.0"
description = "Local CLI and integrity tooling for Verse AI Knowledge V24"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
verse-ai = "verse_ai_knowledge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
