[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verse-ai-knowledge"
version = "25.0.0"
description = "Source-grounded Verse / UEFN knowledge, claim-resolution and verification tooling"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "ariyo-code"}]
license = {file = "LICENSE.md"}
keywords = ["verse", "uefn", "fortnite", "rag", "ai-agents", "code-generation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
  "Private :: Do Not Upload",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5"]
mcp = ["mcp>=2,<3"]

[project.urls]
Repository = "https://github.com/ariyo-code/Verse-AI-Knowledge"
Issues = "https://github.com/ariyo-code/Verse-AI-Knowledge/issues"
Documentation = "https://github.com/ariyo-code/Verse-AI-Knowledge/tree/main/docs"

[project.scripts]
verse-ai = "verse_ai_knowledge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["external", "staging", "portable/archive"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
files = ["src/verse_ai_knowledge"]
